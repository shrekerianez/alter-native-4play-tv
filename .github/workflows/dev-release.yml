name: Publish dev APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dev-release.yml

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare dev assets
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/4PLAY-TV-v0.1.0-dev-debug.apk
          sha256sum downloads/4PLAY-TV-v0.1.0-dev-debug.apk > downloads/4PLAY-TV-v0.1.0-dev-debug.apk.sha256

      - name: Publish dev APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/4PLAY-TV-v0.1.0-dev-debug.apk downloads/4PLAY-TV-v0.1.0-dev-debug.apk.sha256
          git commit -m "Publish 4PLAY TV v0.1.0-dev debug APK"
          git push

# Temporary DEV distribution channel. Production builds will use signed GitHub Releases.
